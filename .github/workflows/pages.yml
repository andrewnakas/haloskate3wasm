name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EMSDK_VERSION: 6.0.10

jobs:
  skate-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native skate library tests
        run: if [ -f skate/Makefile ]; then make -C skate test; fi

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten
        run: |
          if [ ! -x ~/emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          sudo apt-get install -y ninja-build
      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          cd engine
          python3 configure.py --release --web-clean
          ninja web
      - name: Assemble site
        run: tools/make_site.sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: web
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
